name: Unpack Stitch Final Project

on:
  push:
    branches:
      - integrate-stitch-ui

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !startsWith(github.event.head_commit.message, 'Unpack Stitch final project') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integrate-stitch-ui
          fetch-depth: 0

      - name: Unpack verified project archive
        run: |
          set -euo pipefail
          ARCHIVE="magellan-integrate-stitch-ui-final-clean.zip"
          test -f "$ARCHIVE"
          rm -rf /tmp/magellan-import
          mkdir -p /tmp/magellan-import
          unzip -q "$ARCHIVE" -d /tmp/magellan-import
          cp -a /tmp/magellan-import/. .
          rm -rf /tmp/magellan-import
          rm -f "$ARCHIVE"
          rm -f .github/workflows/unpack-stitch-final.yml

      - name: Commit unpacked project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unpack Stitch final project"
          git push origin HEAD:integrate-stitch-ui
