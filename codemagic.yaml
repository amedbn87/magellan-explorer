workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Verify build toolchain
        script: |
          set -euo pipefail
          echo '=== TOOLCHAIN ==='
          node --version
          npm --version
          java -version
          javac -version
          echo '=== TOOLCHAIN OK ==='
      - name: Install dependencies
        script: |
          set -euo pipefail
          npm install
      - name: Build standalone Android web bundle
        script: |
          set -o pipefail
          rm -f android-web-build.log
          {
            echo '=== MAGELLAN ANDROID WEB BUILD ==='
            npm run build:android
            echo '--- normalize Capacitor entry point ---'
            if [ -f .output/public/android-index.html ] && [ ! -f .output/public/index.html ]; then
              cp .output/public/android-index.html .output/public/index.html
            fi
            test -f .output/public/index.html
            find .output/public -maxdepth 3 -type f -print | sort
            echo '=== WEB BUILD PASSED ==='
          } 2>&1 | tee android-web-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' android-web-build.log | tail -n 100 || true
            exit "$status"
          fi
      - name: Generate Android project
        script: |
          set -o pipefail
          rm -f capacitor-build.log
          {
            echo '=== CAPACITOR BUILD ==='
            rm -rf android
            npx cap add android
            if [ ! -f .output/public/index.html ]; then
              echo 'ERROR: Capacitor web directory is missing index.html.'
              exit 1
            fi
            npx cap sync android
            echo '--- verify Capacitor Gradle integration ---'
            if [ ! -f android/capacitor.settings.gradle ]; then
              echo 'capacitor.settings.gradle was not generated; creating the required settings file.'
              printf '%s\n' "// Generated fallback for CI when Capacitor CLI does not persist this file." "include ':capacitor-android'" "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" > android/capacitor.settings.gradle
            fi
            test -f android/capacitor.settings.gradle
            test -f android/app/src/main/assets/capacitor.plugins.json
            echo '--- capacitor.settings.gradle ---'
            cat android/capacitor.settings.gradle
            echo '--- settings.gradle ---'
            sed -n '1,180p' android/settings.gradle 2>/dev/null || sed -n '1,180p' android/settings.gradle.kts
            test -f android/app/build.gradle || test -f android/app/build.gradle.kts
            echo '=== CAPACITOR PASSED ==='
          } 2>&1 | tee capacitor-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' capacitor-build.log | tail -n 120 || true
            exit "$status"
          fi
      - name: Build debug APK
        script: |
          set -o pipefail
          rm -f gradle-build.log
          {
            echo '=== GRADLE APK BUILD ==='
            cd android
            chmod +x gradlew
            java -version
            ./gradlew --version
            ./gradlew clean --no-daemon --stacktrace
            ./gradlew :app:assembleDebug --no-daemon --rerun-tasks --stacktrace --info
            find . -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort
            find . -type d -path '*/build/outputs/*' -print | sort
            APK_PATH=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
            if [ -z "$APK_PATH" ]; then
              echo 'ERROR: Gradle completed but no APK was generated.'
              ./gradlew :app:tasks --all | grep -Ei 'debug|apk|package|assemble' | tail -n 200 || true
              exit 1
            fi
            echo "FOUND APK: $APK_PATH"
            cp "$APK_PATH" ../magellan-debug.apk
            ls -lah ../magellan-debug.apk
            echo '=== APK BUILD PASSED ==='
          } 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== GRADLE FAILURE SUMMARY ==='
            grep -Ein 'error|failed|exception|caused by|could not|unable to|no such file|not found' ../gradle-build.log | tail -n 150 || true
            tail -n 220 ../gradle-build.log || true
          fi
          exit "$status"
    artifacts:
      - magellan-debug.apk
      - android-web-build.log
      - capacitor-build.log
      - gradle-build.log
