name: Build Magellan Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - integrate-stitch-ui

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Standalone Magellan Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout integrate-stitch-ui
        uses: actions/checkout@v4
        with:
          ref: integrate-stitch-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Verify APK is not a development build
        working-directory: native/android
        run: |
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -Eiq 'expo-dev-launcher|expo-dev-menu'; then
            echo 'ERROR: Release APK contains Expo development launcher components.'
            exit 1
          fi
          echo 'Release APK passed development-build component check.'

      - name: Upload standalone installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Magellan-Standalone-Release-APK
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
